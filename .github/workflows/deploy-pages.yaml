name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: string
        required: true
        description: Enter DEPLOY_APPROVED_PAGES only after owner approval

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_APPROVED_PAGES'
    runs-on: ubuntu-latest
    environment: cloudflare-deploy
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name fidan-dev --branch main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
